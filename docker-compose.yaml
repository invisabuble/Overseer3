services:

  Overseer:
    hostname: Overseer
    container_name: Overseer
    image: overseer:latest
    build:
      context: ./docker
      dockerfile: docker-overseer/overseer.dockerfile
    env_file:
      - ./Overseer.env
    volumes:
      - ./volumes/overseer:/Overseer:ro
      - ./docker/docker-apache/web/private/certs:/certs:ro
    expose:
      - "${OSN_PORT}"
    tty: true
    stdin_open: true
    networks:
      - OSN

  Overseer_FE:
    hostname: Overseer_FE
    container_name: Overseer_FE
    image: overseer_fe:latest
    build:
      context: ./docker
      dockerfile: docker-apache/apache.dockerfile
    env_file:
      - ./docker/docker-apache/apache.env 
      - ./docker/docker-mysql/mysql.env
      - ./Overseer.env
    volumes:
      - ./volumes/frontend/public:/var/www/html:ro
      - ./volumes/frontend/private:/private:ro
      - ./docker/docker-apache/web/private/certs:/certs:ro
    ports:
      - "80:80"
      - "443:443"
    tty: true
    stdin_open: true
    networks:
      - OSN
    extra_hosts:
      - "Overseer_FE:127.0.1.1"
      - "overseer.home:${HOST_IP:-127.0.0.1}"

  Overseer_DB:
    hostname: Overseer_DB
    container_name: Overseer_DB
    image: overseer_db:latest
    build:
      context: ./docker
      dockerfile: docker-mysql/mysql.dockerfile
    env_file:
      - ./Overseer.env
      - ./docker/docker-mysql/mysql.env
    volumes:
      - ./volumes/database/db:/var/lib/mysql
      - ./volumes/database/config/Overseer.cnf:/etc/mysql/conf.d/mariadb.cnf:ro
      - ./volumes/database/sql/:/docker-entrypoint-initdb.d/:ro
    tty: true
    stdin_open: true
    networks:
      - OSN

networks:
  OSN:
    name: OSN
    driver: bridge
